[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperio-monaco"
version = "0.1.0"
description = "Inspect Monaco plan files and compare saved planning settings"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
dicom = ["pydicom>=3,<4", "numpy>=1.24"]

[project.scripts]
hyperio = "hyperio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
